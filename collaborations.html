    {

      lat: 35.9606,
      lng: -83.9207,
      type: "other"
    }
  ];

  const map = L.map("world-map", {
    zoomControl: true,
    attributionControl: false,
    worldCopyJump: true
  });

  map.setView([20, 0], 2);

  const worldGeoJsonUrl =
    "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";

  fetch(worldGeoJsonUrl)
    .then(response => response.json())
    .then(worldData => {
      const worldLayer = L.geoJSON(worldData, {
        style: function () {
          return {
            color: "#000000",
            weight: 1,
            opacity: 1,
            fillColor: "#ffffff",
            fillOpacity: 1
          };
        }
      }).addTo(map);

      addCollaborationMarkers();

      const markerBounds = L.latLngBounds(
        collaborationLocations.map(location => [location.lat, location.lng])
      );

      const combinedBounds = worldLayer.getBounds().extend(markerBounds);
      map.fitBounds(combinedBounds.pad(-0.02));
    })
    .catch(error => {
      console.error("Could not load world country outlines:", error);

      addCollaborationMarkers();

      const markerBounds = L.latLngBounds(
        collaborationLocations.map(location => [location.lat, location.lng])
      );

      map.fitBounds(markerBounds.pad(1.2));
    });

  function addCollaborationMarkers() {
    collaborationLocations.forEach(location => {
      const markerHtml = `
        <div class="custom-location-marker ${location.type}"></div>
      `;

      const customIcon = L.divIcon({
        className: "",
        html: markerHtml,
        iconSize: [20, 20],
        iconAnchor: [10, 10],
        popupAnchor: [0, -10]
      });

      const marker = L.marker([location.lat, location.lng], {
        icon: customIcon
      }).addTo(map);

      marker.bindPopup(`
        <strong>${location.name}</strong>
        ${location.label ? `<br/>${location.label}` : ""}
      `);
    });
  }
</script>
