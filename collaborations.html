<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collaborations | The MODES Lab</title>
  <meta name="description" content="Collaborations map for the MODES Lab" />

  <link rel="stylesheet" href="style.css" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    .map-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 28px;
    }

    .map-panel h2 {
      margin-top: 0;
      color: var(--ink);
      text-align: center;
    }

    .map-panel p {
      max-width: 70ch;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .world-map {
      width: 100%;
      height: 560px;
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff;
    }

    .leaflet-container {
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .custom-location-marker {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 2px rgba(0,0,0,.85);
    }

    .custom-location-marker.dublin {
      background: #fad239;
    }

    .custom-location-marker.affiliation {
      background: #6bbe51;
    }

    .custom-location-marker.other {
      background: #007db8;
    }

    .leaflet-popup-content {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.35;
    }

    .popup-list {
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .popup-list div {
      margin-bottom: 4px;
    }

    .popup-list div:last-child {
      margin-bottom: 0;
    }

    .map-legend {
      margin-top: 14px;
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.92rem;
    }

    .map-legend .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .map-legend .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.85);
    }

    .map-legend .dot.dublin {
      background: #fad239;
    }

    .map-legend .dot.affiliation {
      background: #6bbe51;
    }

    .map-legend .dot.other {
      background: #007db8;
    }

    @media (max-width: 700px) {
      .world-map {
        height: 440px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="site-title" href="index.html">
        <img src="images/modes-logo.png" alt="MODES Lab logo" />
        <span class="visually-hidden">The MODES Lab</span>
      </a>

      <nav aria-label="Primary navigation" class="site-nav">
        <a href="index.html">Home</a>
        <a href="research.html">Research</a>
        <a href="projects.html">Projects</a>
        <a href="publications.html">Publications</a>
        <a href="outputs.html">Outputs</a>
        <a href="team.html">Team</a>
        <a aria-current="page" href="collaborations.html">Collaborations</a>
        <a href="news.html">News</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <header class="page-header">
      <h1>Collaborations</h1>
    </header>

    <section class="map-panel">
      <h2>Collaborations</h2>
      <p>
      </p>

      <div id="world-map" class="world-map" aria-label="World map showing collaboration locations"></div>

      <div class="map-legend" aria-label="Map legend">
        <div class="legend-item"><span class="dot dublin"></span>University College Dublin</div>
        <div class="legend-item"><span class="dot affiliation"></span> Current and Former affiliations</div>
        <div class="legend-item"><span class="dot other"></span>Current and Former Collaborators</div>
      </div>
    </section>

    <footer class="site-footer">
      <div>© 2026 Daniel Weller, PhD</div>
      <div>
        <a href="mailto:wellerd2@gmail.com">wellerd2@gmail.com</a>
      </div>
    </footer>
  </main>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

      {

        ],

        lng: -80.4139,
        type: "affiliation"
      },
      {
        institutions: [
          "Centers for Disease Control and Prevention"
        ],
        lat: 33.7490,
        lng: -84.3880,
        type: "affiliation"
      },
      {
        institutions: [
          "Cornell University",
          "Ithaca College"
        ],

        lng: -76.51,

      },
      {

        ],

      },
      {
        institutions: [
          "Seychelles Ministry of Health"
        ],
        lat: -4.6796,

        type: "other"
      },
      {
        institutions: [
          "University of Guelph"
        ],

      {

      },
      {

        ],

      },
      {

      },
      {

      {

      {

      {

          "University of Connecticut"

        lat: 41.6032,

        type: "other"
      },
      {
        institutions: [
          "University at Albany"
        ],
        lat: 42.6526,
        lng: -73.7562,
        type: "other"
      },
      {
        institutions: [
          "University of Tennessee"
        ],
        lat: 35.9606,
        lng: -83.9207,
        type: "other"
      }
    ];

    const map = L.map("world-map", {
      zoomControl: true,
      attributionControl: false,
      worldCopyJump: true
    });

    map.setView([20, 0], 2);

    const worldGeoJsonUrl =
      "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";

    fetch(worldGeoJsonUrl)
      .then(response => response.json())
      .then(worldData => {
        const worldLayer = L.geoJSON(worldData, {
          style: function () {
            return {
              color: "#000000",
              weight: 1,
              opacity: 1,
              fillColor: "#ffffff",
              fillOpacity: 1
            };
          }
        }).addTo(map);

        addCollaborationMarkers();

        const markerBounds = L.latLngBounds(
          collaborationLocations.map(location => [location.lat, location.lng])
        );

        const combinedBounds = worldLayer.getBounds().extend(markerBounds);
        map.fitBounds(combinedBounds.pad(-0.02));
      })
      .catch(error => {
        console.error("Could not load world country outlines:", error);

        addCollaborationMarkers();

        const markerBounds = L.latLngBounds(
          collaborationLocations.map(location => [location.lat, location.lng])
        );

        map.fitBounds(markerBounds.pad(1.2));
      });

    function addCollaborationMarkers() {
      collaborationLocations.forEach(location => {
        const markerHtml = `
          <div class="custom-location-marker ${location.type}"></div>
        `;

        const customIcon = L.divIcon({
          className: "",
          html: markerHtml,
          iconSize: [20, 20],
          iconAnchor: [10, 10],
          popupAnchor: [0, -10]
        });

        const marker = L.marker([location.lat, location.lng], {
          icon: customIcon
        }).addTo(map);

        const institutionList = location.institutions
          ? location.institutions.map(i => `<div>${i}</div>`).join("")
          : `<div>${location.name}</div>`;

        marker.bindPopup(`
          <div class="popup-list">
            ${institutionList}
          </div>
        `);
      });
    }
  </script>
</body>
</html>
